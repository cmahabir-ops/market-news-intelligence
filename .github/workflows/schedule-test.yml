
name: Schedule Diagnostic

on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduled execution
        run: |
          echo "Trigger: ${{ github.event_name }}"
          date -u
          echo "GitHub scheduler test completed."
