name: Scan market news
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-news-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          DISCORD_CRITICAL_WEBHOOK_URL: ${{ secrets.DISCORD_CRITICAL_WEBHOOK_URL }}
          DISCORD_CRYPTO_WEBHOOK_URL: ${{ secrets.DISCORD_CRYPTO_WEBHOOK_URL }}
          DISCORD_STOCK_WEBHOOK_URL: ${{ secrets.DISCORD_STOCK_WEBHOOK_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python engine.py
      - name: Commit updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market news events [skip ci]"
            git push
          fi
